[project]
name = "skillsbary"
version = "0.1.0"
description = "MCP server to store & search GitHub skill repositories (URL + description)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
]

[project.scripts]
skillsbary = "skillsbary.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillsbary"]
